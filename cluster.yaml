apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: argocd
  region: us-east-1
  version: "1.35"

vpc:
  id: "vpc-04aa183195614b72e"
  subnets:
    public:
      us-east-1a:
        id: subnet-0ea93cdacb5c9cf93
      us-east-1c:
        id: subnet-0f664177c764ae63c

nodeGroups:
  - name: public-ng-1
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    subnets:
      - us-east-1a
      - us-east-1c
    ssh:
      allow: true
